# Lint, tests and the static build on every pull request. The deployment is DigitalOcean App Platform's (.do/app.yaml):
# it rebuilds and publishes on every push to main. The site is built twice: closed (noindex, no draft — what is served
# until the first post is published) and open (indexing on, drafts in, so every kind of page exists) for the family's
# SEO contract (scripts/check-seo-family.mjs).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  site:
    name: Lint, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Build, closed (what is served before the first post)
        run: npm run build
      - name: Closed means closed
        run: |
          grep -q "Disallow: /$" out/robots.txt
          grep -q 'name="robots" content="noindex' out/index.html
          test -f out/index.html && test -f out/fr/index.html && test -f out/feed.xml && test -f out/fr/atom.xml && test -f out/llms.txt && test -f out/sitemap.xml && test -f out/admin/index.html && test -f out/admin/config.yml
      - name: Build, open, with the drafts (every page exists)
        env:
          APP_INDEXING_ENABLED: "true"
          APP_SHOW_DRAFTS: "1"
        run: npm run build
      - name: What search engines read on every page (title ≤ 60, description ≤ 155, one h1, alt on every image, no NaN)
        run: node scripts/check-meta.mjs out
      - name: The family's SEO contract
        run: |
          npx --yes serve@14 out -l 3000 >/dev/null 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3000/robots.txt >/dev/null && break; sleep 1; done
          node scripts/check-seo-family.mjs --base http://localhost:3000 --host https://blog.krizaka.com --index on --limit 60
      - name: Every link answers (internal links fail the build; external ones are retried, a short list of hosts that refuse robots is reported only)
        run: node scripts/check-links.mjs --base http://localhost:3000 --host https://blog.krizaka.com --external
      - name: The layout in a real browser (the home, every post and chapter, both languages — nothing past the window at 1750, 1366, 390, 360 px — focus ring for the keyboard only)
        run: |
          npx playwright install --with-deps chromium
          node scripts/check-layout.mjs --base http://localhost:3000 --posts out
      - name: The feeds are pure XML a reader accepts (no XSLT); they stay files, the old /feed/ page is a stub to the story
        run: |
          for f in out/feed.xml out/fr/feed.xml out/atom.xml out/fr/atom.xml; do python3 -c "import sys, xml.dom.minidom as m; m.parse(sys.argv[1])" "$f"; done
          ! grep -q 'xml-stylesheet' out/feed.xml out/fr/feed.xml out/atom.xml out/fr/atom.xml
          test ! -e out/feed.xsl
          grep -q 'http-equiv="refresh" content="0; url=/"' out/feed/index.html
          grep -q 'http-equiv="refresh" content="0; url=/fr/"' out/fr/feed/index.html
          for p in out/index.html out/fr/index.html; do grep -q 'id="subscribe"' "$p"; done
          grep -q 'href="#subscribe"' out/basics/understanding-ai-before-you-start/index.html
          grep -q 'id="subscribe"' out/basics/understanding-ai-before-you-start/index.html
      - name: Every live post has its Open Graph image; the feeds list the posts and the chapters; a retired address is a stub
        run: |
          test -f out/og/understanding-ai-before-you-start.png && test -f out/fr/og/understanding-ai-before-you-start.png
          grep -q "/story/what-a-gpu-costs/" out/feed.xml && grep -q "/fr/story/what-a-gpu-costs/" out/fr/atom.xml
          grep -q 'http-equiv="refresh" content="0; url=/story/what-a-gpu-costs/"' out/posts/what-image-and-video-generation-costs/index.html
      - name: The blog is one page — every removed address is a stub (the 308 of a static host) to the story or what absorbed it
        run: |
          for p in story series tags search saved feed posts; do grep -q 'http-equiv="refresh" content="0; url=/"' "out/$p/index.html"; grep -q 'http-equiv="refresh" content="0; url=/fr/"' "out/fr/$p/index.html"; done
          grep -q 'http-equiv="refresh" content="0; url=/story/what-a-gpu-costs/"' out/tags/costs/index.html
