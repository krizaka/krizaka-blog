# The CI is the org's (krizaka/.github docs/standards/ci-and-deploy.md): the changes gate, the caches, lint, tests with the lcov report,
# the build, SonarCloud and the gate that always reports live in node-ci. This file says only what is the blog's: the site-specific
# checks (closed vs open build, SEO contract, links, layout in a browser, feeds, Open Graph images, stubs) are scripts/ci-after-build.sh.
# The deployment is DigitalOcean App Platform's (.do/app.yaml): it rebuilds and publishes on every push to main.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: krizaka/.github/.github/workflows/node-ci.yml@b2058c12e77ca0da44efb5420d876e80516d8015 # main
    permissions:
      contents: read
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    with:
      sonar: true
      test-script: test:coverage
      after-build: scripts/ci-after-build.sh
      timeout-minutes: 30

  # The branch protection still requires « Lint, tests, build »: this shim reads the gate's verdict (node-ci header). Delete it once
  # the protection requires « ci / CI gate ».
  site:
    name: Lint, tests, build
    needs: ci
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      RESULT: ${{ needs.ci.outputs.result }}
    steps:
      - run: test "$RESULT" = success
