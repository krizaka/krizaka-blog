# blog.krizaka.com — the Krizaka blog on DigitalOcean App Platform (project: krizaka, region tor).
# A static site (the free tier: no instance, no database) rebuilt on every push to main, and the editor's sign-in: two
# small functions (/api/oauth/*, pay-per-use, inside the free allowance at this volume), and the newsletter's four
# (/api/newsletter/*, same allowance; a small table on the existing Postgres cluster, e-mails through the Mailgun account
# krizaka.com already uses: $0 more).
# The site is open to search engines since the first posts were published (2026-10-16): APP_INDEXING_ENABLED is "true".
name: krizaka-blog
region: tor
static_sites:
  - name: site
    github:
      repo: krizaka/krizaka-blog
      branch: main
      deploy_on_push: true
    build_command: npm ci && npm run build
    output_dir: out
    environment_slug: node-js
    error_document: 404.html
    envs:
      - key: APP_INDEXING_ENABLED
        scope: BUILD_TIME
        value: "true"
      # The private preview of the drafts: out/preview/<token>/ (scripts/build.mjs). `unset` here; the real value is set on the
      # app (console or doctl), never in this file.
      - key: APP_PREVIEW_TOKEN
        scope: BUILD_TIME
        type: SECRET
        value: unset
      # The newsletter form's CAPTCHA widget (Cloudflare Turnstile, widget `krizaka-forms`, whose domains include
      # blog.krizaka.com). A site key is public by design: it is inlined in the page.
      - key: NEXT_PUBLIC_ABUSE_CAPTCHA_SITE_KEY
        scope: BUILD_TIME
        value: 0x4AAAAAAFYdSDBwEHMCiX6z
functions:
  - name: oauth
    github:
      repo: krizaka/krizaka-blog
      branch: main
      deploy_on_push: true
    source_dir: functions
    envs:
      # `unset` until the GitHub OAuth App exists (the sign-in answers 503 meanwhile). The real values are set on the app
      # (console or `doctl apps update` with a spec kept outside the repository) — never in this file. BUILD_TIME as well:
      # functions/project.yml substitutes them when the actions are built.
      - key: AUTH_GITHUB_CLIENT_ID
        scope: RUN_AND_BUILD_TIME
        type: SECRET
        value: unset
      - key: AUTH_GITHUB_CLIENT_SECRET
        scope: RUN_AND_BUILD_TIME
        type: SECRET
        value: unset
      # The newsletter (functions/packages/newsletter): Mailgun to send (the MAIL_ context, same account as krizaka.com),
      # the key that signs the confirm/unsubscribe links, the bearer of the send action, the postal address printed in
      # every e-mail (CASL), the list's database (krizaka_newsletter on krizaka-dev-pg, its own role; this app is a
      # trusted source) and the CAPTCHA's secret. Set on the app, never here.
      - { key: MAIL_API_KEY, scope: RUN_AND_BUILD_TIME, type: SECRET, value: unset }
      - { key: MAIL_API_URL, scope: RUN_AND_BUILD_TIME, value: "https://api.mailgun.net" }
      - { key: MAIL_DOMAIN, scope: RUN_AND_BUILD_TIME, value: mg.krizaka.com }
      - { key: MAIL_FROM, scope: RUN_AND_BUILD_TIME, value: "Oussama, Krizaka Blog <blog@mg.krizaka.com>" }
      - { key: MAIL_TOKEN_SECRET, scope: RUN_AND_BUILD_TIME, type: SECRET, value: unset }
      - { key: MAIL_SEND_TOKEN, scope: RUN_AND_BUILD_TIME, type: SECRET, value: unset }
      - { key: DATABASE_URL, scope: RUN_AND_BUILD_TIME, type: SECRET, value: unset }
      - { key: DATABASE_CA_CERT, scope: RUN_AND_BUILD_TIME, type: SECRET, value: unset }
      - { key: MAIL_SENDER_ADDRESS, scope: RUN_AND_BUILD_TIME, value: "Montréal (Québec), Canada" }
      - { key: ABUSE_CAPTCHA_PROVIDER, scope: RUN_AND_BUILD_TIME, value: turnstile }
      - { key: ABUSE_CAPTCHA_SECRET_KEY, scope: RUN_AND_BUILD_TIME, type: SECRET, value: unset }
# Who answers which path: the sign-in functions under /api, the static site everywhere else. The posts merged into a
# chapter keep their address as a static stub page (lib/redirects.json, built by the site): no ingress rule for them.
ingress:
  rules:
    - match: { path: { prefix: /api } }
      component: { name: oauth }
    - match: { path: { prefix: / } }
      component: { name: site }
domains:
  - domain: blog.krizaka.com
    type: PRIMARY
