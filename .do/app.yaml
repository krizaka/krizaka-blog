# blog.krizaka.com — the Krizaka blog on DigitalOcean App Platform (project: krizaka, region tor).
# A static site (the free tier: no instance, no database) rebuilt on every push to main, and the editor's sign-in: two
# small functions (/api/oauth/*, pay-per-use, inside the free allowance at this volume). Nothing else.
# The site is noindex until the first post is published: switch APP_INDEXING_ENABLED to "true" (and redeploy) then.
name: krizaka-blog
region: tor
static_sites:
  - name: site
    github:
      repo: krizaka/krizaka-blog
      branch: main
      deploy_on_push: true
    build_command: npm ci && npm run build
    output_dir: out
    environment_slug: node-js
    error_document: 404.html
    envs:
      - key: APP_INDEXING_ENABLED
        scope: BUILD_TIME
        value: "false"
functions:
  - name: oauth
    github:
      repo: krizaka/krizaka-blog
      branch: main
      deploy_on_push: true
    source_dir: functions
    routes:
      - path: /api
    envs:
      - key: AUTH_GITHUB_CLIENT_ID
        scope: RUN_TIME
        type: SECRET
      - key: AUTH_GITHUB_CLIENT_SECRET
        scope: RUN_TIME
        type: SECRET
domains:
  - domain: blog.krizaka.com
    type: PRIMARY
