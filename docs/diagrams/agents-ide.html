<!doctype html>
<!--
  The two figures of the « In the IDE » section of the agents chapter (krizaka-internal#4125): a SIMULATION of the
  concept, not our code. No real repository, ticket, path, secret or person. Drawn in the Cahier: Seyès paper, blue ink,
  the red margin with its §, square corners, a solid paper offset, Young Serif / Atkinson / Courier Prime / the pen.
  Colours and faces come from @krizaka/tokens and @krizaka/fonts (node_modules), never typed here.

  Render (1600 px wide, FR and EN): node docs/diagrams/render-agents-ide.mjs <out-dir>
  Open by hand: agents-ide.html?fig=tasks&lang=fr  (fig = tasks | log, lang = fr | en)
-->
<html lang="fr" class="theme-light">
  <head>
    <meta charset="utf-8" />
    <title>Krizaka · dans l'IDE (simulation)</title>
    <link rel="stylesheet" href="../../node_modules/@krizaka/fonts/dist/fonts.css" />
    <link rel="stylesheet" href="../../node_modules/@krizaka/tokens/dist/tokens.css" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        background: var(--kz-surface-0);
      }
      body {
        width: 1600px;
        color: var(--kz-text-primary);
        font-family: var(--kz-font-text);
      }

      /* The page: Seyès ruling (a strong line every 32 px, three fine ones between, the verticals) and the red margin. */
      .page {
        position: relative;
        padding: 64px 56px 56px 200px;
        background-color: var(--kz-surface-0);
        background-image:
          linear-gradient(to bottom, var(--kz-paper-rule-major) 2px, transparent 2px),
          linear-gradient(to bottom, var(--kz-paper-rule-minor) 1px, transparent 1px),
          linear-gradient(to right, var(--kz-paper-rule-minor) 1px, transparent 1px);
        background-size:
          100% 32px,
          100% 8px,
          32px 100%;
      }
      .page::before {
        content: "";
        position: absolute;
        top: 0;
        bottom: 0;
        left: 168px;
        border-left: 3px solid var(--kz-paper-rule-margin);
      }
      .section-number {
        position: absolute;
        left: 40px;
        top: 70px;
        font-family: var(--kz-font-mono);
        font-size: 44px;
        color: var(--kz-paper-rule-margin);
      }
      h1 {
        font-family: var(--kz-font-display);
        font-weight: 400;
        font-size: 64px;
        line-height: 1.12;
        letter-spacing: -0.01em;
        max-width: 900px;
      }
      .lead {
        margin-top: 16px;
        font-size: 34px;
        line-height: 1.35;
        color: var(--kz-text-secondary);
        max-width: 1120px;
      }

      /* The « simulation » stamp: the margin's red ink, square, slightly askew — hand-stamped. */
      .stamp {
        position: absolute;
        right: 64px;
        top: 56px;
        transform: rotate(-4deg);
        border: 4px solid var(--kz-paper-rule-margin);
        color: var(--kz-paper-rule-margin);
        font-family: var(--kz-font-mono);
        font-weight: 700;
        padding: 10px 18px 8px;
        text-align: center;
        background: var(--kz-surface-0);
      }
      .stamp b {
        display: block;
        font-size: 40px;
        letter-spacing: 0.04em;
      }
      .stamp span {
        display: block;
        font-size: 22px;
        font-weight: 400;
      }

      /* A sheet laid on the paper: ink line, square corners, solid offset of paper (never a blur). */
      .sheet {
        position: relative;
        margin-top: 80px;
        background: var(--kz-surface-1);
        border: 3px solid var(--kz-text-primary);
        box-shadow: 10px 12px 0 -2px var(--kz-border-strong);
      }
      .tab {
        position: absolute;
        top: -50px;
        left: -3px;
        border: 3px solid var(--kz-text-primary);
        border-bottom: none;
        background: var(--kz-surface-1);
        font-family: var(--kz-font-mono);
        font-size: 28px;
        padding: 8px 18px 6px;
      }

      /* § 1 — the task picker */
      .search {
        display: flex;
        align-items: center;
        gap: 16px;
        margin: 22px 22px 10px;
        padding: 14px 18px;
        border-bottom: 3px solid var(--kz-accent);
        font-size: 36px;
        color: var(--kz-text-secondary);
      }
      .caret {
        width: 3px;
        height: 42px;
        background: var(--kz-accent);
      }
      .row {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 24px;
        padding: 16px 40px;
        font-size: 44px;
        line-height: 1.2;
      }
      .row .name b {
        font-weight: 700;
      }
      .row .note {
        font-family: var(--kz-font-mono);
        font-size: 28px;
        color: var(--kz-text-secondary);
        white-space: nowrap;
      }
      .row.on {
        background: var(--kz-accent-soft);
        box-shadow: inset 8px 0 0 var(--kz-accent);
      }
      .row.on .note {
        color: var(--kz-accent-text);
      }
      .rows {
        padding-bottom: 16px;
      }

      /* § 2 — the live log */
      .log {
        padding: 26px 30px 30px 24px;
        font-family: var(--kz-font-mono);
        font-size: 44px;
        line-height: 1.32;
      }
      .line {
        display: grid;
        grid-template-columns: 136px 52px 1fr;
        column-gap: 14px;
        align-items: start;
        padding: 7px 0;
      }
      .t {
        color: var(--kz-text-secondary);
      }
      .g {
        width: 44px;
        height: 44px;
        margin-top: 2px;
      }
      .g svg {
        width: 44px;
        height: 44px;
        stroke: currentColor;
        fill: none;
        stroke-width: 2.6;
        stroke-linecap: square;
        stroke-linejoin: miter;
      }
      .who {
        font-weight: 700;
      }
      .refuse {
        color: var(--kz-paper-rule-margin);
      }
      .ring {
        position: relative;
        display: inline-block;
      }
      .ring::after {
        content: "";
        position: absolute;
        inset: -10px -16px -8px -14px;
        border: 3px solid var(--kz-paper-rule-margin);
        border-radius: 50%;
        transform: rotate(-3deg);
      }
      .twice {
        text-decoration: underline double var(--kz-accent);
        text-underline-offset: 8px;
        text-decoration-thickness: 3px;
      }
      .cursor {
        display: inline-block;
        width: 22px;
        height: 40px;
        background: var(--kz-text-primary);
        vertical-align: -6px;
      }

      /* Pen notes hanging in the margin, by hand. */
      .note-hand {
        position: absolute;
        left: 6px;
        width: 150px;
        font-family: var(--kz-font-cahier);
        font-size: 38px;
        line-height: 1.05;
        text-align: right;
        transform: rotate(-6deg);
      }
      .note-hand.red {
        color: var(--kz-paper-rule-margin);
      }
      .note-hand.blue {
        color: var(--kz-accent);
      }
      .hand-arrow {
        position: absolute;
        left: 90px;
        width: 150px;
        height: 60px;
      }
      .hand-arrow path {
        fill: none;
        stroke-width: 3;
        stroke-linecap: square;
      }

      .foot {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 24px;
        margin-top: 40px;
        font-family: var(--kz-font-mono);
        font-size: 26px;
        color: var(--kz-text-secondary);
      }
      .foot .fig {
        color: var(--kz-paper-rule-margin);
      }
    </style>
  </head>
  <body>
    <main class="page" id="page"></main>
    <script>
      // The pen's markers (24 grid, square caps, mitred joins), never an emoji.
      const G = {
        coord: '<path d="M3 12h15M13 6l6 6-6 6"/>',
        says: '<path d="M3 4h18v12H10l-5 4v-4H3z"/>',
        tool: '<path d="M14 4a5 5 0 0 0-4 7L3 18l3 3 7-7a5 5 0 0 0 7-4l-3 1-2-2 1-3z"/>',
        refuse: '<path d="M3 3h18v18H3zM8 8l8 8M16 8l-8 8"/>',
        pr: '<path d="M6 3v18M6 9a8 8 0 0 0 8 6h1M18 15a2.5 2.5 0 1 1 0 .1"/>',
        train: '<path d="M4 4h12l4 6v6H4zM4 10h16M8 4v6M6 21a2 2 0 1 1 0-.1M17 21a2 2 0 1 1 0-.1M2 22h20"/>',
        merged: '<path d="M3 13l6 6L21 5"/>',
        alert: '<path d="M12 3l10 18H2zM12 10v5M12 17.5v1"/>',
        close: '<path d="M4 4h16v16H4zM8 12h8M8 16h5"/>',
      };
      const glyph = (k) => `<div class="g"><svg viewBox="0 0 24 24" aria-hidden="true">${G[k]}</svg></div>`;

      const WORDS = {
        fr: {
          stamp: ["simulation", "le concept, pas notre code"],
          tasks: {
            title: "Dans l'IDE, une tâche par question",
            lead: "On lance une tâche et la machine se lit en clair, là où on code.",
            tab: "Lancer une tâche",
            search: "Choisir la tâche à lancer",
            rows: [
              ["Équipe", "journal lisible", "récent"],
              ["Trains", "file de merge", "qui embarque"],
              ["Gardes", "refus du jour", "et pourquoi"],
              ["Alertes", "avec propriétaire", "un nom chacune"],
              ["Coûts", "par session", "tours, minutes"],
              ["Revue", "PR en attente d'un humain", "à lire"],
              ["Rejouer", "session d'hier", "pas à pas"],
            ],
            hand: "un clic,\nça défile",
            fig: "le menu des tâches de l'éditeur",
          },
          log: {
            title: "Une équipe d'agents, lue en direct",
            lead: "Chaque message, chaque outil, chaque refus : en mots simples.",
            tab: "Équipe · journal lisible",
            lines: [
              ["09:02", "coord", "coord", " → équipe : ticket 412, et lui seul"],
              ["09:03", "says", "agent", " dit : je lis les règles avant d'écrire"],
              ["09:07", "tool", "agent", " outil : tests, ", ["twice", "41 verts"]],
              ["09:11", "refuse", "garde", " ", ["ring", "REFUS"], " avant push : secret dans le diff"],
              ["09:12", "says", "agent", " dit : corrigé, je relance"],
              ["09:15", "pr", "PR 87", " ouverte, preuve jointe"],
              ["09:24", "train", "train", " : 87 embarque, wagon 2/3"],
              ["09:31", "merged", "train", " : fusionné"],
              ["09:32", "alert", "alerte", " : build lent, propriétaire plateforme"],
              ["09:33", "close", "session", " close : 31 min, 58 tours, coût noté"],
            ],
            notes: [
              [3, "ouf !", "red"],
              [6, "tchou\ntchou", "blue"],
              [9, "à relire\ndemain", "blue"],
            ],
            fig: "le journal lisible d'une équipe",
          },
          foot: "blog.krizaka.com · nos équipes d'agents",
        },
        en: {
          stamp: ["simulation", "the concept, not our code"],
          tasks: {
            title: "In the IDE, one task per question",
            lead: "Run a task and the machine reads in plain words, where we code.",
            tab: "Run a task",
            search: "Select the task to run",
            rows: [
              ["Team", "readable log", "recent"],
              ["Trains", "merge queue", "who boards"],
              ["Guards", "today's refusals", "and why"],
              ["Alerts", "with an owner", "a name each"],
              ["Costs", "per session", "turns, minutes"],
              ["Review", "PRs waiting for a human", "to read"],
              ["Replay", "yesterday's session", "step by step"],
            ],
            hand: "one click,\nit scrolls",
            fig: "the editor's task menu",
          },
          log: {
            title: "An agent team, read live",
            lead: "Every message, every tool, every refusal: in plain words.",
            tab: "Team · readable log",
            lines: [
              ["09:02", "coord", "coord", " → team: ticket 412, this one only"],
              ["09:03", "says", "agent", " says: reading the rules before writing"],
              ["09:07", "tool", "agent", " tool: tests, ", ["twice", "41 green"]],
              ["09:11", "refuse", "guard", " ", ["ring", "REFUSED"], " before push: secret in the diff"],
              ["09:12", "says", "agent", " says: fixed, running again"],
              ["09:15", "pr", "PR 87", " opened, proof attached"],
              ["09:24", "train", "train", ": 87 boards, car 2/3"],
              ["09:31", "merged", "train", ": merged"],
              ["09:32", "alert", "alert", ": slow build, owner platform"],
              ["09:33", "close", "session", " closed: 31 min, 58 turns, cost logged"],
            ],
            notes: [
              [3, "phew!", "red"],
              [6, "choo\nchoo!", "blue"],
              [9, "reread\ntomorrow", "blue"],
            ],
            fig: "a team's readable log",
          },
          foot: "blog.krizaka.com · our agent teams",
        },
      };

      const q = new URLSearchParams(location.search);
      const lang = q.get("lang") === "en" ? "en" : "fr";
      const fig = q.get("fig") === "log" ? "log" : "tasks";
      const w = WORDS[lang];
      const f = w[fig];
      document.documentElement.lang = lang;
      const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
      const part = (p) => (Array.isArray(p) ? `<span class="${p[0]}">${esc(p[1])}</span>` : esc(p));

      let body = "";
      if (fig === "tasks") {
        const rows = f.rows
          .map(
            (r, i) =>
              `<div class="row${i === 0 ? " on" : ""}"><span class="name"><b>${esc(r[0])}</b> · ${esc(r[1])}</span><span class="note">${esc(r[2])}</span></div>`,
          )
          .join("");
        body = `<div class="sheet" id="sheet"><div class="tab">${esc(f.tab)}</div>
          <div class="search"><span class="caret"></span>${esc(f.search)}</div><div class="rows">${rows}</div></div>`;
      } else {
        const lines = f.lines
          .map(([t, g, who, ...rest]) => {
            const cls = g === "refuse" ? " refuse" : "";
            return `<div class="line${cls}"><span class="t">${t}</span>${glyph(g)}<span><span class="who">${esc(who)}</span>${rest.map(part).join("")}</span></div>`;
          })
          .join("");
        body = `<div class="sheet" id="sheet"><div class="tab">${esc(f.tab)}</div>
          <div class="log">${lines}<div class="line"><span class="t"></span><span></span><span><span class="cursor"></span></span></div></div></div>`;
      }

      const page = document.getElementById("page");
      page.innerHTML = `
        <div class="section-number">§ ${fig === "tasks" ? 1 : 2}</div>
        <div class="stamp"><b>${esc(w.stamp[0])}</b><span>${esc(w.stamp[1])}</span></div>
        <h1>${esc(f.title)}</h1>
        <p class="lead">${esc(f.lead)}</p>
        ${body}
        <div class="foot"><span class="fig">${esc(f.fig)}</span><span>${esc(w.foot)}</span></div>`;

      // Pen notes in the margin, placed beside their line once the faces are laid out.
      document.fonts.ready.then(() => {
        const pageBox = page.getBoundingClientRect();
        const hang = (el, top) => {
          el.style.top = `${top - pageBox.top}px`;
          page.appendChild(el);
        };
        if (fig === "tasks") {
          const first = document.querySelector(".row.on").getBoundingClientRect();
          const n = document.createElement("div");
          n.className = "note-hand blue";
          n.innerHTML = esc(f.hand).replaceAll("\n", "<br>");
          hang(n, first.top - 12);
        } else {
          const rows = document.querySelectorAll(".line");
          for (const [i, words, tone] of f.notes) {
            const r = rows[i].getBoundingClientRect();
            const n = document.createElement("div");
            n.className = `note-hand ${tone}`;
            n.innerHTML = esc(words).replaceAll("\n", "<br>");
            hang(n, r.top - (words.includes("\n") ? 18 : 0));
          }
        }
        document.body.dataset.ready = "1";
      });
    </script>
  </body>
</html>
