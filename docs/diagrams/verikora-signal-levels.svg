<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <!-- Paper background — Cahier register (ADR-004): warm off-white, square corners, blue ink -->
  <rect width="1200" height="800" fill="#F7F5EE"/>

  <!-- Top rule -->
  <line x1="0" y1="0" x2="1200" y2="0" stroke="#C6C3B4" stroke-width="3"/>

  <!-- Header band -->
  <rect x="0" y="0" width="1200" height="96" fill="#F0EDE0"/>
  <line x1="0" y1="96" x2="1200" y2="96" stroke="#C6C3B4" stroke-width="1"/>

  <!-- Product mark: VERIKORA -->
  <text x="600" y="44" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="13" fill="#6B7A8A" letter-spacing="5" font-weight="normal">VERIKORA</text>

  <!-- Diagram title -->
  <text x="600" y="74" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="22" fill="#1A3A5C" letter-spacing="1">Les niveaux de signal du rapport</text>

  <!-- Bottom rule -->
  <line x1="0" y1="797" x2="1200" y2="797" stroke="#C6C3B4" stroke-width="3"/>

  <!-- ── LEVEL 1: observed ── -->
  <!-- Band: y=140 to y=300 (160px) -->
  <!-- Left badge -->
  <rect x="0" y="140" width="240" height="160" fill="#1D6B42"/>
  <!-- Level name (French: "cohérent") -->
  <text x="120" y="208" text-anchor="middle"
        font-family="'Courier New', Courier, monospace"
        font-size="13" fill="#A8DFBF" letter-spacing="2">observed</text>
  <!-- French label -->
  <text x="120" y="234" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="17" fill="#E8F7EF">cohérent</text>
  <!-- Dot indicator -->
  <circle cx="120" cy="263" r="6" fill="#A8DFBF" fill-opacity="0.9"/>

  <!-- Content area -->
  <rect x="240" y="140" width="960" height="160" fill="#F7F5EE"/>
  <!-- Horizontal separator lines (notebook) -->
  <line x1="240" y1="186" x2="1160" y2="186" stroke="#E0DDD0" stroke-width="1"/>
  <line x1="240" y1="220" x2="1160" y2="220" stroke="#E0DDD0" stroke-width="1"/>
  <line x1="240" y1="254" x2="1160" y2="254" stroke="#E0DDD0" stroke-width="1"/>
  <!-- Proof line: dashed arrow from left to right -->
  <line x1="300" y1="208" x2="1020" y2="208" stroke="#1D6B42" stroke-width="2.5"
        stroke-dasharray="10,6" stroke-linecap="round"/>
  <!-- Arrow head -->
  <polygon points="1020,201 1040,208 1020,215" fill="#1D6B42"/>
  <!-- Label: la ligne qui le prouve -->
  <text x="1060" y="204" font-family="Georgia, 'Times New Roman', serif"
        font-size="13" fill="#1D6B42" font-style="italic">la ligne</text>
  <text x="1060" y="219" font-family="Georgia, 'Times New Roman', serif"
        font-size="13" fill="#1D6B42" font-style="italic">qui le prouve</text>

  <!-- Divider between level 1 and 2 -->
  <line x1="0" y1="300" x2="1200" y2="300" stroke="#C6C3B4" stroke-width="1"/>

  <!-- ── LEVEL 2: unusual ── -->
  <!-- Band: y=300 to y=460 (160px) -->
  <!-- Left badge -->
  <rect x="0" y="300" width="240" height="160" fill="#A06010"/>
  <!-- Level name -->
  <text x="120" y="368" text-anchor="middle"
        font-family="'Courier New', Courier, monospace"
        font-size="13" fill="#F5D99A" letter-spacing="2">unusual</text>
  <!-- French label -->
  <text x="120" y="394" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="17" fill="#FEF3D8">à noter</text>
  <!-- Diamond indicator -->
  <polygon points="120,423 130,432 120,441 110,432" fill="#F5D99A" fill-opacity="0.9"/>

  <!-- Content area -->
  <rect x="240" y="300" width="960" height="160" fill="#F7F5EE"/>
  <!-- Horizontal separator lines -->
  <line x1="240" y1="346" x2="1160" y2="346" stroke="#E0DDD0" stroke-width="1"/>
  <line x1="240" y1="380" x2="1160" y2="380" stroke="#E0DDD0" stroke-width="1"/>
  <line x1="240" y1="414" x2="1160" y2="414" stroke="#E0DDD0" stroke-width="1"/>
  <!-- Proof line -->
  <line x1="300" y1="368" x2="1020" y2="368" stroke="#A06010" stroke-width="2.5"
        stroke-dasharray="10,6" stroke-linecap="round"/>
  <!-- Arrow head -->
  <polygon points="1020,361 1040,368 1020,375" fill="#A06010"/>
  <!-- Label -->
  <text x="1060" y="364" font-family="Georgia, 'Times New Roman', serif"
        font-size="13" fill="#A06010" font-style="italic">la ligne</text>
  <text x="1060" y="379" font-family="Georgia, 'Times New Roman', serif"
        font-size="13" fill="#A06010" font-style="italic">qui le prouve</text>

  <!-- Divider between level 2 and 3 -->
  <line x1="0" y1="460" x2="1200" y2="460" stroke="#C6C3B4" stroke-width="1"/>

  <!-- ── LEVEL 3: inconsistent ── -->
  <!-- Band: y=460 to y=620 (160px) -->
  <!-- Left badge -->
  <rect x="0" y="460" width="240" height="160" fill="#8C1A1A"/>
  <!-- Level name -->
  <text x="120" y="528" text-anchor="middle"
        font-family="'Courier New', Courier, monospace"
        font-size="12" fill="#F7BABA" letter-spacing="2">inconsistent</text>
  <!-- French label -->
  <text x="120" y="554" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="17" fill="#FDEAEA">discordant</text>
  <!-- X indicator -->
  <line x1="112" y1="575" x2="128" y2="591" stroke="#F7BABA" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="128" y1="575" x2="112" y2="591" stroke="#F7BABA" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Content area -->
  <rect x="240" y="460" width="960" height="160" fill="#F7F5EE"/>
  <!-- Horizontal separator lines -->
  <line x1="240" y1="506" x2="1160" y2="506" stroke="#E0DDD0" stroke-width="1"/>
  <line x1="240" y1="540" x2="1160" y2="540" stroke="#E0DDD0" stroke-width="1"/>
  <line x1="240" y1="574" x2="1160" y2="574" stroke="#E0DDD0" stroke-width="1"/>
  <!-- Proof line -->
  <line x1="300" y1="528" x2="1020" y2="528" stroke="#8C1A1A" stroke-width="2.5"
        stroke-dasharray="10,6" stroke-linecap="round"/>
  <!-- Arrow head -->
  <polygon points="1020,521 1040,528 1020,535" fill="#8C1A1A"/>
  <!-- Label -->
  <text x="1060" y="524" font-family="Georgia, 'Times New Roman', serif"
        font-size="13" fill="#8C1A1A" font-style="italic">la ligne</text>
  <text x="1060" y="539" font-family="Georgia, 'Times New Roman', serif"
        font-size="13" fill="#8C1A1A" font-style="italic">qui le prouve</text>

  <!-- Bottom rule under level 3 -->
  <line x1="0" y1="620" x2="1200" y2="620" stroke="#C6C3B4" stroke-width="1"/>

  <!-- Footer area -->
  <rect x="0" y="620" width="1200" height="177" fill="#F0EDE0"/>
  <text x="600" y="680" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="13" fill="#8A9AAA" letter-spacing="3">RAPPORT · SEMAINE 46 · 2026</text>

  <!-- Left margin line (notebook style) -->
  <line x1="60" y1="140" x2="60" y2="620" stroke="#D4C8B0" stroke-width="1"/>
</svg>
