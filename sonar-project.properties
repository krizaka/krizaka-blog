sonar.projectKey=krizaka_krizaka-blog
sonar.organization=krizaka
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Generated by scripts/bundle-functions.mjs (a vendored library file and rendered e-mails): analysed in their source packages. The newsletter.js files are byte-identical copies by design (each function is deployed alone).
sonar.exclusions=**/node_modules/**,out/**,.next/**,coverage/**,functions/packages/newsletter/subscribe/turnstile.mjs,functions/packages/newsletter/subscribe/confirmation-emails.json,**/*.test.*,**/*.spec.*,**/__tests__/**,**/e2e/**,**/src/test/**,**/test/fixtures/**
sonar.cpd.exclusions=functions/packages/newsletter/subscribe/turnstile.mjs,functions/packages/newsletter/subscribe/confirmation-emails.json,functions/packages/newsletter/*/newsletter.js

# Test files are tests, not sources: they never count as code to cover (the new-code coverage gate, founder
# decision 9, krizaka-internal#3490) and test rules apply to them. Same patterns are excluded from the sources above.
sonar.tests=.
sonar.test.inclusions=**/*.test.*,**/*.spec.*,**/__tests__/**,**/e2e/**,**/src/test/**,**/test/fixtures/**
